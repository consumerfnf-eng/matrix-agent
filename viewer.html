<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>브랜드 시즌기획 리포트 · v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--ink:#2b2b2b;--sub:#8f8a88;--line:#eeeae8;--bg:#ffffff;--card:#ffffff;
  --coral:#e0747d;--coral2:#c16b66;--orange:#f5936b;--plum:#6c5b7f;--sand:#eae0df;
  --g1:#3e7a63;--g2:#6ba88c;--g3:#9fc7ae;--g4:#cde6d5}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:34px 26px 90px}
h1{font-size:34px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700;margin:0 0 6px}
.sub{color:var(--sub)}.small{font-size:12px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 16px}
/* 에디토리얼 헤더 — 코랄 틱 + 얇은 룰 (Data Viz Kit 느낌) */
.header{padding:6px 2px 22px;border-bottom:2px solid var(--coral);margin-bottom:24px}
.ttl{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.thesis{font-size:15px;color:#5f5a58;margin:6px 0 16px;max-width:760px}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{border:1px solid var(--line);border-radius:11px;padding:10px 16px;min-width:118px}
.stat b{font-size:24px;display:block;color:var(--coral2);font-weight:800}.stat span{font-size:11px;color:var(--sub)}
.rail{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.rail div{border:1px solid var(--line);color:var(--sub);border-radius:20px;padding:5px 13px;font-size:12px}
.upd{font-size:11px;color:var(--sub);margin-top:12px}
.sec-h{display:flex;align-items:center;gap:9px;margin:34px 0 12px;padding-bottom:7px;border-bottom:1px solid #f2d7d9}
.sec-h .n{color:var(--coral);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.chip{display:inline-block;background:#f6f2f1;color:#6a625f;border-radius:20px;padding:2px 10px;font-size:11px;margin:2px 3px 2px 0}
.chip.warn{background:#fdeee7;color:var(--coral2)}.chip.acc{background:#e8f1ec;color:var(--g1)}
.brow{display:flex;align-items:center;gap:8px;margin:3px 0}
.brow .lbl{width:150px;font-size:12px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .pct{width:70px;text-align:right;font-size:11px;color:var(--sub);flex:none}
.matrix{display:grid;gap:5px;min-width:620px}
.mc{border:1px solid var(--line);border-radius:9px;padding:9px;font-size:12px;cursor:pointer;transition:.12s}
.mc:hover{outline:2px solid var(--coral);outline-offset:-2px}
.mc.hd{background:#faf6f5;color:var(--coral2);text-align:center;font-weight:700;cursor:default;border-color:#f2d7d9}
.mc b{font-size:17px;font-weight:800}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ph{width:100%;height:130px;object-fit:contain;object-position:center;border-radius:8px;background:#f4f1ef}
body[data-outer="1"] .ph{height:200px;object-fit:contain}
body[data-outer="1"] .sc .rep{height:280px}
body[data-outer="1"] .sc .rep img{object-fit:contain}
.sc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;margin-bottom:16px}
.sc .top{display:grid;grid-template-columns:180px 1fr;gap:0}
.sc .rep{height:196px;background:#f4f1ef}.sc .rep img{width:100%;height:100%;object-fit:cover;object-position:center bottom}
.sc .body{padding:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--ink);transition:.12s}
.btn:hover{border-color:var(--coral);color:var(--coral2)}
.btn.p{background:var(--coral);color:#fff;border-color:var(--coral)}.btn.p:hover{background:var(--coral2);color:#fff}
.tag{font-size:10px;padding:1px 7px;border-radius:5px;background:#efeae8;color:#7a7370;margin-right:4px;font-weight:600}
.read{background:#fbf5f4;border-left:3px solid var(--coral);padding:10px 13px;border-radius:0 9px 9px 0;font-size:13px;margin-top:10px;color:#5f5a58}
a.src{color:var(--coral2);text-decoration:none;font-size:12px}
.empty{color:var(--sub);font-size:13px;padding:16px;text-align:center}
@media(max-width:640px){.sc .top{grid-template-columns:1fr}.sc .rep{height:200px}h1{font-size:26px}}
</style></head>
<body>
<div class="wrap" id="report">
  <div class="header">
    <div class="ttl"><div><h1 id="hTitle">시즌기획 리포트</h1>
      <div id="hProjBadge" style="display:inline-block;margin:4px 0;padding:3px 10px;border-radius:6px;background:#1d3a2f;color:#fff;font-size:12px;font-weight:700"></div>
      <select id="projSel" onchange="pickProject(this.value)" style="margin-left:8px;padding:3px 8px;font-size:12px;display:none"></select>
      <div class="thesis" id="hThesis">지금 뜨는 트렌드와 검증된 레퍼런스를 브랜드 DNA로 재해석해, 카테고리×라이프스타일별 다음 시즌 방향을 제안합니다.</div></div>
      <div style="text-align:right;white-space:nowrap">
        <button class="btn" onclick="reloadAll()">↻ 새로고침</button>
        <button class="btn" onclick="saveStyleHTML()">스타일만 내보내기</button>
        <button class="btn p" onclick="saveHTML()">전체 리포트 저장</button>
      </div>
    </div>
    <div class="stats" id="hStats"></div>
    <div class="rail"><div>① 트렌드 흐름</div><div>② 매트릭스(카테고리×DNA)</div><div>③ 강세·공백 판정</div><div>④ 전체 구성비율</div><div>⑤ 스타일 추천</div></div>
    <div class="upd" id="hUpd"></div>
  </div>
  <div id="body"></div>
</div>
<script>
const SB_URL='https://qlrinkwpqqgutievzctk.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFscmlua3dwcXFndXRpZXZ6Y3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MTYwODIsImV4cCI6MjEwMTM5MjA4Mn0.hCM_TFE-IUbjlYx8R_eeaDjRSLdNUMP90dmiv4K920Y';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sel=(t,q)=>fetch(`${SB_URL}/rest/v1/${t}?${q}`,{headers:{apikey:SB_ANON,Authorization:'Bearer '+SB_ANON}}).then(r=>r.ok?r.json():[]);
const pub=p=>`${SB_URL}/storage/v1/object/public/product-images/${p}`;
let openCell=null, DATA=null;

function pctBars(pairs,total){
  if(!total)return '<div class="small">데이터 없음</div>';
  return pairs.map(([k,v])=>{const p=Math.round(v/total*100);
    return `<div class="brow"><div class="lbl" title="${esc(k)}">${esc(k)}</div>
      <div class="bar"><span style="width:${p}%"></span></div><div class="pct">${v} · ${p}%</div></div>`;}).join('');
}
function tally(arr){const m={};arr.forEach(x=>{if(x==null||x==='')return;m[x]=(m[x]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
const PALETTE=['#e0747d','#3e7a63','#f5936b','#6c5b7f','#6ba88c','#c16b66','#9fc7ae','#c19a86','#8f7a9c','#cde6d5','#eab0a0','#b9d9c6'];
// 도넛 SVG + 범례 (data: [[label,value],...]) — 미분류는 호출 전에 제거
function donut(data,{size=120,unit='모델',note=''}={}){
  const tot=data.reduce((s,d)=>s+d[1],0);
  if(!tot)return '<div class="small">데이터 없음</div>';
  const R=size/2,r=R*0.6;let a=-Math.PI/2,arcs='';
  data.forEach(([,v],i)=>{const ang=v/tot*2*Math.PI,a2=a+ang;
    const x1=R+R*Math.cos(a),y1=R+R*Math.sin(a),x2=R+R*Math.cos(a2),y2=R+R*Math.sin(a2);
    const xi=R+r*Math.cos(a2),yi=R+r*Math.sin(a2),xi1=R+r*Math.cos(a);
    const big=ang>Math.PI?1:0;
    arcs+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${xi} ${yi} A${r} ${r} 0 ${big} 0 ${xi1} ${R+r*Math.sin(a)} Z" fill="${PALETTE[i%PALETTE.length]}"/>`;
    a=a2;});
  const leg=data.map(([k,v],i)=>`<div class="brow"><span style="width:10px;height:10px;border-radius:2px;background:${PALETTE[i%PALETTE.length]};flex:none"></span>
    <div class="lbl" title="${esc(k)}">${esc(k)}</div><div class="pct">${v} · ${Math.round(v/tot*100)}%</div></div>`).join('');
  return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">${arcs}
      <text x="${R}" y="${R-2}" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">${tot}</text>
      <text x="${R}" y="${R+13}" text-anchor="middle" font-size="9" fill="#6b6b6b">${unit}</text></svg>
    <div style="min-width:150px;flex:1">${leg}${note?`<div class="small" style="margin-top:5px;color:#999">${note}</div>`:''}</div></div>`;
}
function stars(n,max){const k=Math.max(1,Math.min(3,Math.round(n/Math.max(1,max)*3)));return '★'.repeat(k);}
// 트렌드 태그 코드 → 한글 라벨 (없으면 원문 표시)
const KW_KO={comfort:'컴포트·편안함',tall_boot:'롱부츠',slouch_biker:'슬라우치 바이커',texture_plush:'퍼·플러시',brown_suede:'브라운 스웨이드',almond_soft_square:'아몬드·소프트 스퀘어 토',block_lowheel:'블록 로우힐',pointed_toe:'포인티드 토',dress_shoe:'드레스 슈즈',high_vamp:'하이뱀프',slipper_mule:'슬리퍼·뮬',animal_exotic:'애니멀·엑조틱',color_accent:'컬러 액센트',slim_sneaker:'슬림 스니커',technical_sneaker:'테크니컬 스니커',statement_sneaker:'스테이트먼트 스니커',two_tone:'투톤',embellishment:'장식·엠벨리시',heritage_hybrid:'헤리티지 하이브리드',market_signal:'시장 신호',dress_revival:'드레스 슈즈 복귀'};
const kwko=w=>(window.KWKO&&window.KWKO[w])||KW_KO[w]||w;
// 신호 코드 → 축(소재/컬러/디테일/솔/토) 그룹 + 한글
const SIG_AXIS={SUEDE_UPPER:'소재',LEATHER_UPPER:'소재',TECHNICAL_MESH:'소재',MESH:'소재',KNIT_UPPER:'소재',KNIT:'소재',CANVAS:'소재',NUBUCK:'소재',SHEARLING:'소재',PATENT:'소재',SATIN:'소재',VELVET:'소재',RUBBER:'소재',
  TWO_TONE:'컬러',COLOR_BLOCK:'컬러',COLORBLOCK:'컬러',MONOCHROME:'컬러',COLOR_ACCENT:'컬러',TONAL:'컬러',
  MOLDED_LOGO:'디테일',ALLOVER_MONOGRAM:'디테일',MONOGRAM:'디테일',EMBELLISHMENT:'디테일',MARY_JANE_STRAP:'디테일',LACE_TRIM:'디테일',VELCRO_STRAP:'디테일',METAL_HARDWARE:'디테일',METALLIC_TRIM:'디테일',APPLIQUE:'디테일',BUCKLE:'디테일',STRAP:'디테일',
  CHUNKY_SOLE:'솔',PLATFORM:'솔',FLAT_SOLE:'솔',CUP_SOLE:'솔',BUBBLE_SOLE:'솔',LUG_SOLE:'솔',THICK_SOLE:'솔',THIN_SOLE:'솔',VULCANIZED:'솔',WEDGE:'솔',
  LOW_PROFILE:'토·프로파일',HIGH_VAMP:'토·프로파일',ROUND_TOE:'토·프로파일',POINTED_TOE:'토·프로파일',SQUARE_TOE:'토·프로파일',ALMOND_TOE:'토·프로파일'};
const SIG_KO={SUEDE_UPPER:'스웨이드 어퍼',LEATHER_UPPER:'레더 어퍼',TECHNICAL_MESH:'테크니컬 메쉬',KNIT_UPPER:'니트 어퍼',SHEARLING:'시어링',PATENT:'페이턴트',TWO_TONE:'투톤',COLOR_BLOCK:'컬러 블록',MONOCHROME:'모노크롬',COLOR_ACCENT:'컬러 액센트',MOLDED_LOGO:'몰디드 로고',ALLOVER_MONOGRAM:'올오버 모노그램',MONOGRAM:'모노그램',EMBELLISHMENT:'장식',MARY_JANE_STRAP:'메리제인 스트랩',LACE_TRIM:'레이스 트림',METAL_HARDWARE:'메탈 하드웨어',APPLIQUE:'아플리케',CHUNKY_SOLE:'청키 솔',PLATFORM:'플랫폼',FLAT_SOLE:'플랫 솔',CUP_SOLE:'컵솔',BUBBLE_SOLE:'버블 솔',LUG_SOLE:'러그 솔',THICK_SOLE:'두꺼운 솔',LOW_PROFILE:'로우 프로파일',HIGH_VAMP:'하이뱀프',ROUND_TOE:'라운드 토',POINTED_TOE:'포인티드 토',SQUARE_TOE:'스퀘어 토',ALMOND_TOE:'아몬드 토'};
const sigko=s=>SIG_KO[s]||s.toLowerCase().replace(/_/g,' ');
// 지배 속성을 축별 최상위 신호로 묶어 mockup의 소재/컬러/디테일/솔 행 재현
function axisRows(sigEntries){
  const max=sigEntries.length?sigEntries[0][1]:1; const byAx={};
  sigEntries.forEach(([s,n])=>{const ax=SIG_AXIS[s]||'기타'; if(!byAx[ax])byAx[ax]=[s,n];});
  const order=['소재','컬러','디테일','솔','토·프로파일','기타'];
  return order.filter(a=>byAx[a]).map(a=>{const[s,n]=byAx[a];
    return `<div style="display:flex;gap:10px;font-size:12.5px;margin:3px 0"><span style="width:64px;color:var(--sub);flex:none">${a}</span><b>${esc(sigko(s))}</b> <span style="color:var(--coral)">${stars(n,max)}</span> <span class="small">${n}</span></div>`;}).join('');
}
// 워드클라우드: 빈도가 클수록 크게 (12~30px), 상위는 코랄
function wordcloud(freq,{max=40}={}){
  const arr=freq.slice(0,max); if(!arr.length)return '';
  const hi=arr[0][1], lo=arr[arr.length-1][1]||1;
  const size=n=>12+Math.round((n-lo)/Math.max(1,hi-lo)*18);
  return `<div style="display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:6px 2px">
    ${arr.map(([w,n],i)=>`<span title="${n}건" style="font-size:${size(n)}px;font-weight:${n>=hi*0.6?800:600};color:${i<3?'var(--coral)':i<8?'var(--coral2)':'#8a7f7c'};line-height:1.1">${esc(kwko(w))}<sub style="font-size:10px;color:var(--sub);font-weight:400"> ${n}</sub></span>`).join('')}
  </div>`;
}

async function reloadAll(){
  $('#body').innerHTML='<div class="card"><div class="empty">불러오는 중…</div></div>';
  // 트렌드·이미지는 스냅샷 유무와 무관하게 항상 로드(올린 트렌드가 바로 보이도록)
  const [snaps,prods,trendsRaw,cads,srcs]=await Promise.all([
    sel('matrix_snapshots','status=eq.APPROVED&order=approved_at.desc,created_at.desc&limit=40&select=*'),
    sel('products','select=model_key,storage_path,image_url&limit=8000'),
    sel('trend_items','select=article_title,publisher,summary_ko,trend_keywords,og_image_url,source_url,season,coverage_group,confidence,source_id,project&order=created_at.desc&limit=1000'),
    sel('cad_refs','select=subcategory,public_url').catch(()=>[]),
    sel('sources','select=id,project').catch(()=>[])
  ]);
  const imgMap={}; prods.forEach(p=>{imgMap[p.model_key]=p.storage_path?pub(p.storage_path):(p.image_url||'')});
  window.CADV={}; (cads||[]).forEach(c=>{if(c.public_url)window.CADV[String(c.subcategory||'').replace(/[\s_]/g,'').toLowerCase()]=c.public_url;});
  // 소스 → 프로젝트 맵 (트렌드를 프로젝트별로 거르기 위함)
  const S2P={}; (srcs||[]).forEach(s=>{S2P[s.id]=s.project||'MLB|SHOES';});
  window._S2P=S2P; window._trendsRaw=trendsRaw;
  // 프로젝트별 최신 승인본 1개씩(같은 27FW라도 MLB/DUVETICA 섞이지 않게)
  // 프로젝트 + 기획시즌 조합별 최신 승인본 1개씩 (27FW / 27SS 가 따로 뜨게)
  const perProj={}; (snaps||[]).forEach(s=>{
    const pj=s.project||(s.computed&&s.computed.project)||'MLB|SHOES';
    const ss=s.planning_season||(s.computed&&s.computed.season)||'';
    const key=ss?(pj+'|'+ss):pj;
    if(!perProj[key])perProj[key]=s;
  });
  window.PROJ_SNAPS=perProj;
  window._prodImgMap=imgMap;
  const projKeys=Object.keys(perProj);
  const psel=document.getElementById('projSel');
  if(projKeys.length>1){ psel.style.display=''; psel.innerHTML=projKeys.map(k=>`<option value="${esc(k)}">${esc(k.split('|').join(' › '))}</option>`).join(''); }
  await pickProject(projKeys[0]||'MLB|SHOES');
  return;
}
async function pickProject(pj){
  const snap=(window.PROJ_SNAPS||{})[pj]||null;
  const comp=snap?.computed||{}, cells=comp.cells||{}; let props=[];
  if(snap) props=await sel('style_proposals','snapshot_id=eq.'+snap.id+'&select=*&order=line.asc,rank.asc');
  const imgMap=window._prodImgMap||{};
  // 트렌드도 현재 프로젝트 것만. 우선 트렌드 자체의 project, 없으면 소스 project, 그것도 없으면 MLB|SHOES.
  const _pjBase=String(pj).split('|').slice(0,2).join('|');
  const S2P=window._S2P||{}, raw=(window._trendsRaw||[]).filter(t=>(t.project||(t.source_id&&S2P[t.source_id])||'MLB|SHOES')===_pjBase);
  const macros=raw.filter(t=>t.coverage_group==='MACRO');
  const kwmapRow=raw.find(t=>t.coverage_group==='KWMAP');
  window.KWKO=Object.assign({},KW_KO); if(kwmapRow){try{const m=JSON.parse(kwmapRow.summary_ko||'{}');Object.assign(window.KWKO,m.ko||{});}catch(_){}}
  const trends=raw.filter(t=>t.coverage_group!=='MACRO'&&t.coverage_group!=='KWMAP');
  DATA={snap,comp,cells,props,imgMap,trends,macros};
  const _pp=String(pj).split('|');
  const brand=comp.brand||_pp[0], cat=comp.category||(_pp[1]||'');
  const isOuter=String(cat).toUpperCase()!=='SHOES';
  document.body.dataset.outer=isOuter?'1':'';
  $('#hTitle').textContent=`${brand} ${cat} · ${snap?.planning_season||comp.season||''} 시즌기획 리포트`;

let LIFE_DATA={};

function lifeKeyStore(lk){return 'mx_look_'+((DATA&&DATA.snap&&DATA.snap.id)?DATA.snap.id:'x')+'_'+lk;}
function loadLifeState(lk){try{return JSON.parse(localStorage.getItem(lifeKeyStore(lk)))||null;}catch(e){return null;}}

function lifeState(lk){
  const d=LIFE_DATA[lk]; if(!d)return {on:[],main:null,off:[]};
  const all=d.items.map(x=>x.img);
  let st=loadLifeState(lk);
  if(!st||!Array.isArray(st.on))st={on:all.slice(),off:[],main:all[0]||null};
  st.off=st.off||[];
  st.on=st.on.filter(u=>all.includes(u));
  all.forEach(u=>{if(!st.on.includes(u)&&!st.off.includes(u))st.on.push(u);});
  if(!st.main||!st.on.includes(st.main))st.main=st.on[0]||null;

}

window.showCell=(key,keep)=>{
  openCell=key; const c=DATA.cells[key]; if(!c)return;
  const [line,dna]=key.split('|');
  const groups={}; (c.refs||[]).forEach(r=>{const g=r.sub||'미분류';(groups[g]=groups[g]||[]).push(r);});
  const gl=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  const topSub=gl.slice(0,3).map(([s,rs])=>`${s}(${rs.length})`).join(' · ');
  const sig=Object.entries(c.sigs||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([s])=>s).join(' · ');
  const trTop=Object.entries(c.trendKw||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([w])=>kwko(w)).join(' · ');
  const brs=(c.brands||[]).slice(0,6).join(', ');
  let h=`<div class="card" style="margin:0;border-color:var(--coral)">
    <div class="ttl"><h3 style="margin:0">${esc(line)} × ${esc(dna)}</h3><button class="btn" onclick="closeCell()">닫기 ✕</button></div>
    <div class="small" style="margin:4px 0 6px">모델 ${c.models} · SKU ${c.skus} · 브랜드 ${(c.brands||[]).length}${c.mentions?` · 트렌드 자료 ${c.mentions}`:''}</div>
    <div class="read" style="margin:0 0 10px">이 칸은 총 <b>${c.models}모델·${(c.brands||[]).length}브랜드</b>로, 지배 서브카테고리는 <b>${esc(topSub||'—')}</b>입니다.${sig?` 주요 구조 신호는 ${esc(sig)}이며,`:''} 참고 브랜드는 ${esc(brs||'—')} 등입니다.${trTop?` <b>이 칸과 연결된 상위 트렌드: ${esc(trTop)}.</b>`:''}${c.mentions?` 트렌드 자료 ${c.mentions}건이 이 방향과 연결됩니다.`:''}</div>`;
  // 그룹 박스 1개 렌더 (small=1~2모델용 압축 배치)
  const gBox=(sub,rs,small)=>`<div style="border:1px solid var(--line);border-radius:9px;padding:10px;background:#fcfbf8${small?'':';margin-bottom:10px'}">
    <div style="font-weight:700;margin-bottom:6px;font-size:${small?'13px':'inherit'}">${esc(sub)} <span class="small">· ${rs.length}모델</span></div>

  // 3모델 이상은 기존처럼 한 줄 전체, 1~2모델짜리는 모아서 한 줄에 최대 3그룹
  const bigG=gl.filter(([,rs])=>rs.length>=3), smallG=gl.filter(([,rs])=>rs.length<3);
  let gh=bigG.map(([sub,rs])=>gBox(sub,rs,false)).join('');

  }
  h+=gh||'<div class="small">레퍼런스 없음</div>';
  h+=`</div>`;
  $('#cellDetail').innerHTML=h;
  if(!keep)$('#cellDetail').scrollIntoView({behavior:'smooth',block:'nearest'});

  if(!sec){alert('스타일 추천 섹션이 아직 없습니다.');return;}
  const wrap=document.createElement('div'); wrap.appendChild(sec.cloneNode(true));
  let el=sec.nextElementSibling;
  while(el&&!el.classList.contains('sec-h')){wrap.appendChild(el.cloneNode(true));el=el.nextElementSibling;}
  const title=`${(DATA?.comp?.brand||'')} ${(DATA?.comp?.category||'')} 스타일 추천 · ${(DATA?.snap?.planning_season||DATA?.comp?.season||'')}`;
  const miniJs=`<script>
    window.toggleFold=function(id,btn){var el=document.getElementById(id);if(!el)return;var open=el.style.display==='none';el.style.display=open?'block':'none';var a=btn&&btn.querySelector('.fold-arrow');if(a)a.textContent=open?'▾':'▸';};
    window.hoverPrev=function(src){var el=document.getElementById('hoverPrevBox');if(!el){el=document.createElement('div');el.id='hoverPrevBox';el.style.cssText='position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);cursor:zoom-out';el.innerHTML='<img style="max-width:88vw;max-height:88vh;border-radius:12px;box-shadow:0 12px 48px rgba(0,0,0,.5);background:#fff">';el.onclick=function(){el.style.display='none';};document.body.appendChild(el);}el.querySelector('img').src=src;el.style.display='flex';};
    window.hoverHide=function(){var el=document.getElementById('hoverPrevBox');if(el)el.style.display='none';};
    window.dlImg=function(url,name){fetch(url).then(function(r){return r.blob();}).then(function(b){var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=name||'image.jpg';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);}).catch(function(){window.open(url,'_blank');});};
    window.showMore=function(id,btn){var els=document.querySelectorAll('[data-more="'+id+'"]');for(var i=0;i<els.length;i++){els[i].style.display='block';}if(btn)btn.style.display='none';};
    window.toggleStyleCell=function(gid){var el=document.getElementById(gid);if(!el)return;var open=el.style.display==='none';el.style.display=open?'block':'none';var b=document.getElementById('btn_'+gid);if(b)b.classList.toggle('p',open);if(open)el.scrollIntoView({behavior:'smooth',block:'nearest'});};
    window.selSub=function(gid,idx,n){for(var i=0;i<n;i++){var pane=document.getElementById(gid+'_'+i);if(pane)pane.style.display=i===idx?'block':'none';var btn=document.querySelector('[data-tab="'+gid+'_'+i+'"]');if(btn)btn.classList.toggle('p',i===idx);}};
  <\/script>`;
  const html=`<!doctype html><html lang="ko"><head>${document.head.innerHTML}${miniJs}</head><body><div class="wrap">
    <div class="header"><h1>${title}</h1><div class="thesis">서브카테고리별 MASS·NEW 스타일 제안과 근거 분포. 칸·서브카테고리를 누르면 열립니다.</div></div>
    ${wrap.innerHTML}</div></body></html>`;
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`${(DATA?.comp?.brand||'스타일')}_${(DATA?.comp?.category||'')}_스타일추천_${(DATA?.snap?.planning_season||DATA?.comp?.season||'')}_${new Date().toISOString().slice(0,10)}.html`.replace(/[\\/\s]+/g,'_');a.click();
}

if(window.__MLB_FROZEN__){

    window.KWKO=F.KWKO||{}; window.CADV=F.CADV||{};
    DATA=F.DATA; render();
    $('#hTitle')&&(DATA.snap)&&($('#hTitle').textContent=`${(DATA.comp?.brand||'')} ${(DATA.comp?.category||'')} · ${DATA.snap.planning_season||DATA.comp?.season||''} 시즌기획 리포트`);
  }catch(e){ $('#body').innerHTML='<div class="card"><div class="empty">저장본 로드 오류: '+e.message+'</div></div>'; }
}else{
